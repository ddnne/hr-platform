[project]
name = "hr-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.18.1",
    "cvxpy==1.9.3",
    "clarabel==0.11.1",
    "PyYAML==6.0.2",
]
[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
